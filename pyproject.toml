[project]
name = "mac-address-formatter"
version = "0.1.0"
description = "Parse, validate, and reformat MAC addresses between colon, hyphen, dot, and raw hex notations."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
